<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#102b1c"><title>Eco Viva — Configurar administrador</title><link rel="stylesheet" href="components/admin.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="script/admin.js" defer></script></head><body class="admin-page"><main class="admin-login"><section class="admin-login-card"><div class="admin-brand"><div class="admin-brand-mark"><i class="fa-solid fa-shield-halved"></i></div><div><strong>Eco Viva</strong><span>Primeira configuração</span></div></div><h1>Criar acesso do dono</h1><p>Esta tela só funciona enquanto nenhum administrador existir. A chave de configuração aparece no terminal que iniciou o servidor.</p><form id="adminSetupForm" class="admin-form" style="grid-template-columns:1fr"><div class="admin-field"><label>CHAVE MOSTRADA NO TERMINAL</label><input name="setupKey" required autocomplete="off"></div><div class="admin-field"><label>SEU NOME</label><input name="name" required autocomplete="name"></div><div class="admin-field"><label>SEU E-MAIL</label><input name="email" type="email" required autocomplete="email"></div><div class="admin-field"><label>SENHA DO ADMINISTRADOR (MÍN. 10)</label><input name="password" type="password" required autocomplete="new-password"></div><div class="admin-field"><label>CONFIRMAR SENHA</label><input name="confirmPassword" type="password" required autocomplete="new-password"></div><div id="setupError" class="admin-error"></div><button class="admin-btn" type="submit">Criar acesso administrativo</button></form><div style="margin-top:18px;text-align:center;font-size:.68rem"><a href="admin-login.html" style="color:var(--admin-ink);font-weight:800;text-decoration:none">← Voltar para login administrativo</a></div></section></main></body></html>
